name: CI/CD — build chess images → GHCR → deploy VPS

# Mỗi lần push lên main: build 4 image cờ vua trên runner của GitHub, đẩy lên GHCR,
# rồi SSH vào VPS để pull + restart (KHÔNG biên dịch trên VPS).
# Cấu hình secrets/lần đầu: xem docs/deploy/cicd.md
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr.io/<owner>/weknora-chess-<svc>:<tag>  (owner phải viết thường — covuaduongsinh OK)
  GHCR_PREFIX: ghcr.io/${{ github.repository_owner }}/weknora-chess
  # Khai MỘT chỗ: vừa dùng cho setup-go, vừa nhúng vào binary làm "Phiên bản Go"
  # trên trang Thông tin hệ thống — tránh hai nơi trôi lệch nhau.
  GO_VERSION: "1.26"


jobs:
  # ---- Frontend (cần dựng dist trước rồi mới docker build) ----
  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend dist
        env:
          VITE_IS_DOCKER: "true"
          VITE_FRONTEND_COMMIT: ${{ github.sha }}
        run: ./scripts/build_frontend_dist.sh
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push UI
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_PREFIX }}-ui:latest
            ${{ env.GHCR_PREFIX }}-ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

  # ---- Backend (app / docreader / chess-engine), build từ context gốc ----
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: docker/Dockerfile.app
            args: |
              COMMIT_ID_ARG=${{ github.sha }}
          - name: docreader
            file: docker/Dockerfile.docreader
            args: ""
          - name: chess-engine
            file: docker/Dockerfile.chess-engine
            args: |
              ARASAN_VERSION=v25.4
              ARASAN_BUILD=modern
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Dockerfile.app nhan 4 build-arg (VERSION/COMMIT_ID/BUILD_TIME/GO_VERSION)
      # roi `make build-prod` nhung chung vao binary qua ldflags. Truoc day CI chi
      # truyen COMMIT_ID nen trang "Thong tin he thong" hien Phien ban ung dung /
      # Thoi gian build / Phien ban Go deu la "unknown".
      - name: Chuan bi thong tin phien ban
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            ${{ matrix.args }}
            VERSION_ARG=${{ steps.meta.outputs.version }}
            BUILD_TIME_ARG=${{ steps.meta.outputs.build_time }}
            GO_VERSION_ARG=${{ env.GO_VERSION }}
          tags: |
            ${{ env.GHCR_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.GHCR_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ---- Test gate: chặn deploy nếu test hỏng ----
  # Từ 22/8/2026 gate đã mở rộng ra TOÀN BỘ tầng service + modelcontext + frontend
  # (`npm test`, `vue-tsc --noEmit`). Nợ type upstream từng là lý do không gate
  # vue-tsc nay đã sạch, còn test tầng service thì đây là nơi DUY NHẤT chúng chạy
  # được (máy Windows crash SIGSEGV gojieba ở internal/types.init). Ngay lần đầu
  # bật đã bắt 6 lỗi thật — xem .claude/memory/04-nhat-ky-tuy-bien.md.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: go vet (chess)
        run: go vet ./internal/chess/... ./internal/agent/tools/... ./internal/config/...
      - name: go test (chess)
        run: go test ./internal/chess/... ./internal/agent/tools/...
      # Tầng service + modelcontext KHÔNG chạy được trên máy Windows của Thầy:
      # `internal/types.init()` gọi gojieba.NewJieba (cgo) và crash SIGSEGV
      # TRƯỚC khi hàm test nào chạy. Trên Linux thì bình thường, nên đây là nơi
      # DUY NHẤT các test lớp cờ ở tầng service (chess_library_*, indexer, tag…)
      # thực sự được chạy runtime. Xem 04-nhat-ky-tuy-bien.md.
      - name: go test (service + modelcontext)
        run: go test ./internal/application/service/... ./internal/modelcontext/...
      - name: frontend test + type-check
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx vue-tsc --noEmit

  # ---- Deploy: SSH vào VPS, git pull (lấy compose/scripts mới) rồi pull image + up ----
  deploy:
    needs: [build-ui, build-backend, test]
    runs-on: ubuntu-latest
    # CHỈ tự deploy khi build từ main. Nhờ vậy `workflow_dispatch` trên một nhánh
    # khác chỉ DỰNG image lên GHCR mà không đụng production — đúng thứ ta cần khi
    # nâng cấp lớn: dựng image trước, rồi tự tay backup + đặt lại
    # schema_migrations trên VPS, rồi mới đổi sang image mới.
    # Xem docs/deploy/upstream-sync.md.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          # VPS_SSH_KEY được lưu dạng base64 (1 dòng) để tránh lỗi xuống dòng khi
          # copy/paste private key → "error in libcrypto". Giải mã ngược ở đây.
          printf '%s' "$VPS_SSH_KEY" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "cd /opt/WeKnora_chess && git pull --ff-only && IMAGE_TAG=$IMAGE_TAG bash scripts/deploy/pull-deploy.sh"
